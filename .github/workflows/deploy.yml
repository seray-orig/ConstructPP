name: TestsAndBuildConstructPP

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]

jobs:
  asp-api_unit-tests:
    runs-on: ubuntu-latest
    
    steps:
    - name: Клонируем репозиторий
      uses: actions/checkout@v6

    - name: Установка .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Виновник торжества
      run: dotnet test ConstructPP.API.UnitTests

  asp-api_integration-tests:
    runs-on: ubuntu-latest
    needs: asp-api_unit-tests
    
    steps:
    - name: Клонируем репозиторий
      uses: actions/checkout@v6

    - name: Установка .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Виновник торжества
      run: dotnet test ConstructPP.API.IntegrationTests

  build:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: asp-api_integration-tests
    runs-on: ubuntu-latest

    steps:
    - name: Клонируем репозиторий
      uses: actions/checkout@v6

    - name: Установка Node
      uses: actions/setup-node@v4
      with:
        node-version: '24.x'
        cache: npm
        cache-dependency-path: ConstructPP.React/package-lock.json

    - name: Установка зависимостей React
      run: npm ci
      working-directory: ./ConstructPP.React

    - name: Сборка React
      run: npm run build
      working-directory: ./ConstructPP.React

    - name: Перенос React в wwwroot
      run: |
        mkdir -p ./ConstructPP.API/wwwroot
        cp -r ./ConstructPP.React/dist/* ./ConstructPP.API/wwwroot/

    - name: Установка .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Публикация API
      run: |
        dotnet publish ConstructPP.API/ConstructPP.API.csproj -c Release -r linux-x64 -o ./publish-x64 -p:Version=${GITHUB_REF#refs/tags/v}
        dotnet publish ConstructPP.API/ConstructPP.API.csproj -c Release -r linux-arm64 -o ./publish-arm64 -p:Version=${GITHUB_REF#refs/tags/v}

    - name: Упаковка API в архив
      run: |
        tar -cvf - ./publish-x64/ | xz -9e -T 0 > ConstructPP-linux-x64.tar.xz
        tar -cvf - ./publish-arm64/ | xz -9e -T 0 > ConstructPP-linux-arm64.tar.xz

    - name: Сохраняем артефакт x64
      uses: actions/upload-artifact@v4
      with:
        name: ConstructPP-linux-x64
        path: ConstructPP-linux-x64.tar.xz

    - name: Сохраняем артефакт arm64
      uses: actions/upload-artifact@v4
      with:
        name: ConstructPP-linux-arm64
        path: ConstructPP-linux-arm64.tar.xz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
    - name: Забираем артефакты
      uses: actions/download-artifact@v4
      with:
        pattern: 'ConstructPP-linux-*'
        merge-multiple: true

    - name: Генерация SHA256
      run: sha256sum ConstructPP-linux-x64.tar.xz ConstructPP-linux-arm64.tar.xz > checksums.txt

    - name: Обновление тега latest
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git tag -f latest
        git push -f origin latest

    - name: Создаём релиз на GitHub
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ConstructPP-linux-x64.tar.xz
          ConstructPP-linux-arm64.tar.xz
          checksums.txt
        generate_release_notes: true
        make_latest: true